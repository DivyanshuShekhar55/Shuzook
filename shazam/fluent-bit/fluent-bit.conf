# the core of setting up fluent-bit

[SERVICE]
    Flush         1       # send buffered events to output every 1 second
    Daemon        Off     # runs in foreground (good for dev/docker)
    Log_Level     info    # fluent bit's own internal log verbosity
    Parsers_File  /fluent-bit/etc/parsers.conf  # load your parser definitions from this file

[INPUT]
    Name              tail          # use the tail plugin (like `tail -f`)
    Tag               shazam.logs   # internal routing label for this stream
    Path              /var/log/shazam/shazam.log  # file to watch inside docker volume
    Parser            shazam_parser          # apply the json parser defined in parsers.conf
    DB                /fluent-bit/state/tail-state.db    # checkpoint file — explained below
    Read_from_Head    true          # on first start, read from beginning of file (could be end in some cases)
    Rotate_Wait       30            # seconds to wait after rotation before closing
    Refresh_Interval  3             # re-scan the file for new lines every 3s

# DB /fluent-bit/state/tail-state.db — this is important.
# Fluent Bit writes a small SQLite file here that tracks how far it has read in your log file (the byte offset / inode). So even if it crashes and restarts, it can start from where it crashed
# Fluent Bit creates the file on first run if it doesn't exist. You never manually create it. The directory must exist though 

# Rotate_Wait X — after lumberjack renames shazam.log → shazam-2026-04-03.log (old archived ones), Fluent Bit waits X seconds before it stops reading the old file. This is the safety buffer to make sure it catches any last lines written before the rename completed

# It does not mean logs are delayed by X seconds end-to-end. It means the maximum lag between your app writing a line and Fluent Bit picking it up is X seconds


# we can add, set, remove, rename and copy fields
# Only records tagged shazam.logs pass through this filter. Records with other tags are untouched.

[FILTER]
    Name   modify
    Match  shazam.logs
    Add    source shazam-api
# we also Add a new field "source" with the value "shazam-api" this is useful when we have multiple services all shipping logs to a common clickhouse
# like payments, rate limiter, business logic, etc, etc, identify from logs


# where data goes
# This is sending logs directly to ClickHouse's HTTP interface. ClickHouse exposes a plain HTTP endpoint that accepts SQL + data — no special driver needed
# just direct fluent-bit's output to that http location

[OUTPUT]
    Name                http
    Match               shazam.logs   # only process events with this tag
    Host                clickstack    # Docker service name
    Port                8123          # 8123 is ClickHouse's default HTTP port
    URI                 /?query=INSERT%20INTO%20observability.app_logs%20FORMAT%20JSONEachRow&input_format_skip_unknown_fields=1
    Format              json_lines
    Json_date_key       time
    Json_date_format    iso8601
    Header              Content-Type application/json

# URI: INSERT INTO observability.app_logs — target database (observability) and table (app_logs).
# FORMAT JSONEachRow — tells ClickHouse the body of the HTTP request is one JSON object per line. This matches Format json_lines on the Fluent Bit side
# input_format_skip_unknown_fields=1 — critical safety flag. If log has a field that doesn't exist as a column in your ClickHouse table, ClickHouse ignores that field and inserts the rest. Without this, any unexpected field from our Go app would cause insert failures.

# Format json_lines — Fluent Bit serializes each event as one JSON object per line in the HTTP request body. This is what ClickHouse expects with JSONEachRow.
# Json_date_key time — Fluent Bit's internal event timestamp is not automatically included in the output JSON. This tells "write the timestamp into a field called time". Without this, your time column in ClickHouse would be empty
# Json_date_format iso8601 — format that timestamp as an ISO 8601 string like 2026-04-03T10:22:11+05:30

# Header: Tells ClickHouse what format the HTTP body is in